<!doctype html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Rito Mimarlık | İletişim</title>

  <link rel="stylesheet" href="/css/pages/contact.css" />
</head>

<body>
  <header class="contact-page-header">
    <h1 class="contact-page-title">Bizimle İletişime Geçin</h1>

    <p class="contact-page-description">
      Size özel fiyat teklifi almak için aşağıdaki formu doldurun.
    </p>

    <p class="required-fields-note">
      <span class="required-fields-note-asterisk" aria-hidden="true">*</span> ile işaretlenen alanlar zorunludur.
    </p>
  </header>

  <main class="contact-page-main">
    <form id="quote-form">
      <fieldset class="form-section option-group">
        <legend>Kimin adına teklif alıyorsunuz?</legend>

        <div class="option">
          <input type="radio" id="customer-type-individual" name="customer-type" value="individual" required />

          <label for="customer-type-individual">
            Kendim adına (Bireysel)
          </label>
        </div>

        <div class="option">
          <input type="radio" id="customer-type-business" name="customer-type" value="business" checked />

          <label for="customer-type-business">
            Şirketim adına (Kurumsal)
          </label>
        </div>
      </fieldset>

      <fieldset class="form-section">
        <legend>İletişim Bilgileri</legend>

        <div class="form-group">
          <label for="full-name">Ad Soyad</label>

          <input type="text" id="full-name" name="full-name" placeholder="Adınız Soyadınız" autocomplete="name"
            required />
        </div>

        <div class="form-group">
          <label for="phone">Telefon Numarası</label>

          <input type="tel" id="phone" name="phone" placeholder="05XX XXX XX XX" autocomplete="tel" inputmode="tel" />
        </div>

        <div class="form-group">
          <label for="email">E-posta Adresi</label>

          <input type="email" id="email" name="email" placeholder="ornek@firma.com" autocomplete="email" required />
        </div>
      </fieldset>

      <fieldset class="form-section option-group">
        <legend>Tercih Edilen İletişim Yöntemi</legend>

        <div class="option">
          <input type="radio" id="contact-method-email" name="contact-method" value="email" required />

          <label for="contact-method-email">E-posta</label>
        </div>

        <div class="option">
          <input type="radio" id="contact-method-phone" name="contact-method" value="phone" />

          <label for="contact-method-phone">Telefon</label>
        </div>
      </fieldset>

      <!-- <fieldset class="form-section" data-customer-fields="individual">
        <legend>Bireysel Müşteri Bilgileri</legend>

      </fieldset> -->

      <fieldset class="form-section" data-customer-fields="business">
        <legend>Firma Bilgileri</legend>

        <div class="form-group">
          <label for="company-name">Firma Adı</label>

          <input type="text" id="company-name" name="company-name" placeholder="Firma adı" autocomplete="organization"
            required />
        </div>

        <div class="form-group">
          <label for="company-role">Görev veya Departman</label>

          <input type="text" id="company-role" name="company-role" placeholder="Örneğin: Proje yöneticisi"
            autocomplete="organization-title" />
        </div>
      </fieldset>

      <fieldset class="form-section">
        <legend>Proje Detayları</legend>

        <div class="form-group">
          <label for="requested-service">Talep Edilen Hizmet</label>

          <select id="requested-service" name="requested-service" required>
            <option value="" selected disabled>Hizmet seçin</option>
            <option value="interior-design">İç mimari tasarım</option>
            <option value="architectural-project">Mimari proje</option>
            <option value="construction-renovation">Uygulama / tadilat</option>
            <option value="consulting">Danışmanlık</option>
            <option value="project-management">Proje yönetimi</option>
            <option value="other">Diğer</option>
          </select>
        </div>



        <div class="form-group">
          <label for="project-type">Proje Türü</label>

          <select id="project-type" name="project-type" required>
            <option value="" selected disabled>Proje türü seçin</option>
            <option value="residential">Konut</option>
            <option value="office">Ofis</option>
            <option value="retail">Mağaza</option>
            <option value="restaurant-cafe">Restoran / Kafe</option>
            <option value="other">Diğer</option>
          </select>

        </div>

        <div class="form-group">
          <label for="address">
            Proje Adresi veya Mevkii
          </label>

          <input type="text" id="address" name="address" placeholder="İl, ilçe veya proje mevkii"
            autocomplete="street-address" />
        </div>

        <div class="form-group">
          <label for="message">Projenizi ve ihtiyaçlarınızı kısaca açıklayın</label>
          <textarea id="message" name="message" rows="10"
            placeholder="Örneğin: İstanbul Kadıköy’de bulunan yaklaşık 120 m² dairemiz için iç mimari tasarım ve uygulama hizmeti almak istiyoruz. Projeye üç ay içinde başlamayı planlıyoruz."
            required></textarea>
        </div>

      </fieldset>

      <div class="kvkk-group">
        <input type="checkbox" id="kvkk-consent" name="kvkk-consent" required>
        <label for="kvkk-consent">
          <a href="/privacy/" target="_blank" rel="noopener">İletişim Formu Aydınlatma Metni</a>’ni
          okudum ve kişisel
          verilerimin işlenmesi hakkında bilgi edindim.
        </label>
      </div>

      <div class="form-actions">
        <button type="submit">Formu Gönder</button>
      </div>

    </form>
  </main>

  <footer class="site-footer"></footer>

  <script type="module" src="/js/main.js"></script>
</body>

</html>
